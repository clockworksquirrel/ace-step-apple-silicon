name: Claude

# Claude Code on this repo (added by Tab for Josh, Nov 2026):
#  - reviews every pull request automatically (opened / new commits / reopened / ready for review)
#  - answers "@claude ..." in PR comments, review comments and issues
# Runs on GitHub-hosted ubuntu-latest. Needs the CLAUDE_CODE_OAUTH_TOKEN secret (from `claude setup-token`);
# without it the job skips with a warning instead of failing.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  review:
    name: Claude review
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - id: auth
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          echo "ok=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
          if [ "$HAS_TOKEN" != "true" ]; then echo "::warning::CLAUDE_CODE_OAUTH_TOKEN secret is not set; Claude review skipped."; fi
      - if: steps.auth.outputs.ok == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - if: steps.auth.outputs.ok == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Focus on correctness bugs, security problems, CI/workflow mistakes,
            performance, and missing tests. Follow CLAUDE.md / AGENTS.md conventions if present.
            Be concise and specific; skip praise and nitpicks.
            Put line-specific findings as inline comments (mcp__github_inline_comment__create_inline_comment)
            and post one overall summary with `gh pr comment`.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  mention:
    name: Claude (@claude)
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - id: auth
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          echo "ok=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
          if [ "$HAS_TOKEN" != "true" ]; then echo "::warning::CLAUDE_CODE_OAUTH_TOKEN secret is not set; @claude skipped."; fi
      - if: steps.auth.outputs.ok == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - if: steps.auth.outputs.ok == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
